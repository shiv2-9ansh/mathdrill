<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>QuantDrill Elite</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');

:root {
  --bg: #050505;
  --card: #111111;
  --acc: #f97316;
  --text: #ffffff;
  --dim: #71717a;
  --err: #ef4444;
  --suc: #22c55e;
  --font: 'JetBrains Mono', monospace;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { 
    background: var(--bg); color: var(--text); font-family: var(--font); 
    height: 100vh; overflow: hidden; display: flex; flex-direction: column;
}

/* --- UI Architecture --- */
#app { flex: 1; display: flex; flex-direction: column; padding-top: var(--safe-top); }

.screen { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.header { width: 100%; display: flex; justify-content: space-between; padding: 10px 20px; }
.brand { font-size: 24px; font-weight: 800; letter-spacing: -1.5px; background: linear-gradient(to right, #facc15, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

/* --- Game Elements --- */
.problem-box { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; }
.q-text { font-size: 56px; font-weight: 800; text-align: center; margin-bottom: 10px; transition: transform 0.1s; }
.a-input { font-size: 64px; color: var(--acc); font-weight: 700; min-height: 80px; border-bottom: 2px solid #222; min-width: 200px; text-align: center; }
.a-input.wrong { color: var(--err); animation: shake 0.2s 2; }
.est-tag { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 2px; margin-top: 10px; }

@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

/* --- Numpad Elite --- */
.numpad { 
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; 
    background: #222; border-top: 1px solid #222; padding-bottom: var(--safe-bottom);
}
.key { 
    background: var(--bg); padding: 25px 0; font-size: 28px; font-weight: 600; 
    display: flex; justify-content: center; align-items: center; cursor: pointer;
}
.key:active { background: #111; }
.key.spec { color: var(--dim); font-size: 18px; }
.key.enter { background: var(--acc); color: #000; font-weight: 800; grid-column: span 2; }

/* --- Progress Tracking --- */
.progress-container { width: 100%; height: 4px; background: #111; position: relative; }
.progress-bar { height: 100%; background: var(--acc); transition: width 0.3s; }
.streak-counter { font-size: 14px; font-weight: 700; color: var(--acc); }

/* --- Menu & Stats --- */
.menu-card { background: var(--card); border-radius: 20px; padding: 25px; width: 100%; max-width: 360px; margin-top: 20px; border: 1px solid #222; }
.stat-row { display: flex; justify-content: space-between; margin-bottom: 15px; }
.btn { width: 100%; padding: 18px; border-radius: 12px; font-weight: 800; border: none; cursor: pointer; font-family: var(--font); margin-top: 10px; }
.btn-primary { background: var(--acc); color: #000; }
.btn-outline { background: transparent; border: 1px solid #333; color: var(--text); }

.badge { font-size: 10px; padding: 4px 8px; border-radius: 4px; font-weight: 800; }
.badge-optiver { background: #1e40af; color: #fff; }

.hide { display: none !important; }
</style>
</head>
<body>

<div id="app">
    <!-- Menu Screen -->
    <div id="menuScreen" class="screen">
        <div class="brand">QuantDrill Elite</div>
        <div class="menu-card">
            <div class="stat-row">
                <div><p style="font-size:10px; color:var(--dim)">TOTAL SOLVED</p><p id="totalSolved" class="stat-val">0</p></div>
                <div><p style="font-size:10px; color:var(--dim)">TRADER RANK</p><p id="traderRank" style="color:var(--acc)">Trainee</p></div>
            </div>
            <button class="btn btn-primary" onclick="initGame('standard')">Standard Drill (2m)</button>
            <button class="btn btn-outline" onclick="initGame('optiver')">Optiver 80 in 8 <span class="badge badge-optiver">PRO</span></button>
            <button class="btn btn-outline" style="margin-top:20px" onclick="resetStats()">Reset Analytics</button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen hide">
        <div class="progress-container"><div id="pBar" class="progress-bar"></div></div>
        <div class="header">
            <div><p class="stat-label">TIME</p><p id="timer" class="stat-val">--:--</p></div>
            <div style="text-align:right"><p class="stat-label">STREAK</p><p id="streak" class="streak-counter">0</p></div>
        </div>
        
        <div class="problem-box">
            <div id="estMode" class="est-tag hide">Estimation (±5%)</div>
            <div id="qText" class="q-text">--</div>
            <div id="aInput" class="a-input"></div>
        </div>

        <div class="numpad" style="width:100%">
            <div class="key" onclick="handleInput('1')">1</div>
            <div class="key" onclick="handleInput('2')">2</div>
            <div class="key" onclick="handleInput('3')">3</div>
            <div class="key" onclick="handleInput('4')">4</div>
            <div class="key" onclick="handleInput('5')">5</div>
            <div class="key" onclick="handleInput('6')">6</div>
            <div class="key" onclick="handleInput('7')">7</div>
            <div class="key" onclick="handleInput('8')">8</div>
            <div class="key" onclick="handleInput('9')">9</div>
            <div class="key spec" onclick="handleInput('-')">-</div>
            <div class="key" onclick="handleInput('0')">0</div>
            <div class="key spec" onclick="handleInput('.')">.</div>
            <div class="key spec" onclick="handleInput('DEL')">DEL</div>
            <div class="key enter" onclick="handleInput('ENT')">SUBMIT</div>
        </div>
    </div>

    <!-- Results Screen -->
    <div id="resultScreen" class="screen hide">
        <div class="brand">Drill Summary</div>
        <div class="menu-card">
            <div class="stat-row">
                <div style="text-align:center; width:100%">
                    <p style="font-size:12px; color:var(--dim)">FINAL SCORE</p>
                    <p id="finalScore" style="font-size:64px; font-weight:800">0</p>
                </div>
            </div>
            <div id="weaknessAlert" style="font-size:12px; background:#221111; padding:10px; border-radius:8px; color:var(--err); margin-bottom:15px; border:1px solid #442222;" class="hide">
                <strong>Attention:</strong> Your speed drops on multiplications involving 7s and 8s. Focus on these.
            </div>
            <button class="btn btn-primary" onclick="showMenu()">Continue</button>
        </div>
    </div>
</div>

<script>
"use strict";

// --- Configuration & Weakness Engine ---
let stats = JSON.parse(localStorage.getItem('qd-stats')) || { solved: 0, history: [], weaknesses: {} };
let game = { mode: 'standard', timer: null, timeLeft: 0, score: 0, streak: 0, qCount: 0, currentQ: null, input: "" };

const saveStats = () => localStorage.setItem('qd-stats', JSON.stringify(stats));

// --- Math Engine (Quant Focused) ---
function generateQuantProblem() {
    const types = ['arith', 'arith', 'arith', 'estimation', 'percentage', 'square'];
    const type = types[Math.floor(Math.random() * types.length)];
    
    // Adaptive logic: If user is weak in multiplication, increase chance
    let a, b, answer, text, isEst = false;

    switch(type) {
        case 'arith':
            const ops = ['+', '-', '×', '÷'];
            const op = ops[Math.floor(Math.random() * ops.length)];
            if(op === '+') { a = rand(10, 99); b = rand(10, 99); answer = a + b; text = `${a}+${b}`; }
            if(op === '-') { a = rand(20, 150); b = rand(10, a); answer = a - b; text = `${a}-${b}`; }
            if(op === '×') { a = rand(2, 14); b = rand(2, 19); answer = a * b; text = `${a}×${b}`; }
            if(op === '÷') { b = rand(2, 12); answer = rand(2, 15); a = b * answer; text = `${a}÷${b}`; }
            break;
        case 'estimation':
            a = rand(11, 99); b = rand(11, 99);
            answer = a * b; text = `${a}×${b}`; isEst = true;
            break;
        case 'percentage':
            const p = [5, 10, 15, 20, 25, 50, 75];
            a = p[Math.floor(Math.random() * p.length)];
            b = rand(1, 20) * 20;
            answer = (a / 100) * b; text = `${a}% of ${b}`;
            break;
        case 'square':
            a = rand(2, 20); answer = a * a; text = `${a}²`;
            break;
    }
    return { text, answer, isEst };
}

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

// --- Game Logic ---
function initGame(mode) {
    game.mode = mode;
    game.score = 0;
    game.streak = 0;
    game.qCount = 0;
    game.timeLeft = mode === 'optiver' ? 480 : 120;
    game.input = "";
    
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hide'));
    document.getElementById('gameScreen').classList.remove('hide');
    
    nextQuestion();
    startTimer();
}

function startTimer() {
    clearInterval(game.timer);
    game.timer = setInterval(() => {
        game.timeLeft--;
        updateHUD();
        if(game.timeLeft <= 0) endDrill();
    }, 1000);
}

function nextQuestion() {
    game.currentQ = generateQuantProblem();
    game.input = "";
    document.getElementById('qText').innerText = game.currentQ.text;
    document.getElementById('aInput').innerText = "";
    document.getElementById('estMode').classList.toggle('hide', !game.currentQ.isEst);
}

function handleInput(key) {
    const display = document.getElementById('aInput');
    if(key === 'DEL') game.input = game.input.slice(0, -1);
    else if(key === 'ENT') validate();
    else if(game.input.length < 8) game.input += key;
    display.innerText = game.input;
}

function validate() {
    const userVal = parseFloat(game.input);
    const actual = game.currentQ.answer;
    let correct = false;

    if(game.currentQ.isEst) {
        const margin = actual * 0.05;
        if(Math.abs(userVal - actual) <= margin) correct = true;
    } else {
        if(Math.abs(userVal - actual) < 0.01) correct = true;
    }

    if(correct) {
        game.score += 1;
        game.streak++;
        stats.solved++;
        nextQuestion();
    } else {
        if(game.mode === 'optiver') {
            game.score -= 2;
            nextQuestion();
        } else {
            const el = document.getElementById('aInput');
            el.classList.add('wrong');
            setTimeout(() => { el.classList.remove('wrong'); game.input = ""; el.innerText = ""; }, 300);
            game.streak = 0;
        }
    }
    updateHUD();
}

function updateHUD() {
    const m = Math.floor(game.timeLeft / 60);
    const s = game.timeLeft % 60;
    document.getElementById('timer').innerText = `${m}:${s.toString().padStart(2, '0')}`;
    document.getElementById('score').innerText = game.score;
    document.getElementById('streak').innerText = game.streak;
    document.getElementById('pBar').style.width = `${(game.score / 80) * 100}%`;
}

function endDrill() {
    clearInterval(game.timer);
    document.getElementById('gameScreen').classList.add('hide');
    document.getElementById('resultScreen').classList.remove('hide');
    document.getElementById('finalScore').innerText = game.score;
    saveStats();
}

function showMenu() {
    document.getElementById('resultScreen').classList.add('hide');
    document.getElementById('menuScreen').classList.remove('hide');
    document.getElementById('totalSolved').innerText = stats.solved;
    
    // Rank logic
    let rank = "Trainee";
    if(stats.solved > 100) rank = "Junior Trader";
    if(stats.solved > 500) rank = "Market Maker";
    if(stats.solved > 1000) rank = "Legend";
    document.getElementById('traderRank').innerText = rank;
}

function resetStats() {
    if(confirm("Clear all data?")) {
        stats = { solved: 0, history: [], weaknesses: {} };
        saveStats();
        showMenu();
    }
}

// Support Physical Keyboard
window.addEventListener('keydown', e => {
    if(e.key >= '0' && e.key <= '9') handleInput(e.key);
    if(e.key === '.') handleInput('.');
    if(e.key === '-') handleInput('-');
    if(e.key === 'Enter') handleInput('ENT');
    if(e.key === 'Backspace') handleInput('DEL');
});

// Boot
showMenu();
</script>
</body>
</html>
