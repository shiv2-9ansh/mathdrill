<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap');

  --bg:#0a0a0a;--s:#111;--b:#1a1a1a;--b2:#1f1f1f;--t:#e4e4e7;

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:360px}
.stat-card{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:12px 10px;display:flex;flex-direction:column;align-items:center}
.stat-val{font-size:20px;font-weight:700}
.stat-key{font-size:9px;color:var(--d);text-transform:uppercase;letter-spacing:1px;margin-top:2px}

.op-rows{width:100%;display:flex;flex-direction:column;gap:6px;margin:8px 0}
.op-row{display:flex;align-items:center;gap:8px}
.op-sym{width:28px;font-size:13px;font-weight:700;color:var(--acc);text-align:center;flex-shrink:0}
.op-bar{flex:1;height:6px;background:var(--b);border-radius:3px;overflow:hidden}
.op-fill{height:100%;border-radius:3px;transition:width .4s ease}
.op-pct{width:36px;font-size:12px;font-weight:600;text-align:right;color:#a1a1aa}
.op-ms{width:36px;font-size:11px;color:var(--d);text-align:right}

.insight{width:100%;background:var(--s);border:1px solid var(--b);border-left:3px solid var(--acc);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;margin-top:6px}
.insight.high{border-left-color:var(--red)}.insight.positive{border-left-color:var(--grn)}.insight.medium{border-left-color:var(--acc)}
.insight-icon{font-size:16px;line-height:1.4;flex-shrink:0}
.insight-text{font-size:12px;color:#a1a1aa;line-height:1.5}

.log-toggle{font-size:12px;color:var(--d);cursor:pointer;padding:6px 0;width:100%;text-align:left;background:none;border:none;font-family:var(--f)}
.log-box{max-height:200px;overflow-y:auto;background:#0f0f0f;border:1px solid var(--b);border-radius:10px;padding:10px;margin-top:4px;font-size:12px;width:100%}
.log-item{padding:3px 0;display:flex;justify-content:space-between}

.rb{width:100%;max-width:360px;border:1px solid;border-radius:14px;padding:14px 16px;text-align:center;margin-bottom:4px;background:var(--s)}
.rb-label{font-size:16px;font-weight:700;letter-spacing:.5px}
.rb-sub{font-size:11px;color:var(--d);margin-top:2px}
.chart-box{background:#0f0f0f;border:1px solid var(--b);border-radius:12px;padding:16px 12px 8px;margin-top:4px;width:100%;overflow:hidden}
.chart-box svg{width:100%;display:block}
.section{width:100%;margin-top:4px}

/* Leaderboard */
.lb-row{width:100%;display:flex;align-items:center;gap:10px;background:var(--s);border:1px solid var(--b);border-radius:10px;padding:10px 12px;margin-top:4px}
.lb-rank{font-size:16px;font-weight:800;width:28px;text-align:center;flex-shrink:0}
.lb-name{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-val{font-size:14px;font-weight:700;color:var(--gold)}
.lb-me{border-color:var(--acc);background:#1a1000}

/* Nav tabs */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--b);display:flex;padding-bottom:var(--sb);z-index:20}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;background:none;border:none;color:var(--d);cursor:pointer;font-family:var(--f);font-size:9px;letter-spacing:.5px}
.nav-btn.active{color:var(--acc)}
.nav-icon{font-size:18px}

.error-msg{color:var(--red);font-size:12px;text-align:center;min-height:16px;margin-top:4px}
.btn-google{width:100%;max-width:320px;padding:13px 0;border-radius:12px;background:#fff;color:#333;font-weight:600;font-size:14px;border:none;cursor:pointer;font-family:var(--f);display:flex;align-items:center;justify-content:center;gap:10px}
.btn-google:active{opacity:.85;transform:scale(.98)}
.btn-google svg{width:18px;height:18px}
.auth-divider{width:100%;max-width:320px;display:flex;align-items:center;gap:12px;margin:4px 0}
.auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:var(--b2)}
.auth-divider span{font-size:11px;color:var(--d);text-transform:uppercase;letter-spacing:1px}
.friend-code{font-size:28px;font-weight:800;letter-spacing:4px;color:var(--gold);padding:8px 0}
.copy-btn{background:var(--s);border:1px solid var(--b2);border-radius:8px;padding:6px 14px;color:var(--m);font-size:12px;font-family:var(--f);cursor:pointer}
</style>

<script>
"use strict";

/*═══════════════════════════════════════════════════

═══════════════════════════════════════════════════*/
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDRWow5cDBJRtAAsTRSoDxQaWQ_yCNQL-Y",
  authDomain: "mathdrill-9da20.firebaseapp.com",
  projectId: "mathdrill-9da20",
  storageBucket: "mathdrill-9da20.firebasestorage.app",
  messagingSenderId: "1003675186914",
  appId: "1:1003675186914:web:2ba46111409647c163d0bb",
  measurementId: "G-RDPX8BFQXN"
};
/*const FIREBASE_CONFIG = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "000000000000",
  appId: "YOUR_APP_ID"
};*/

// Check if Firebase is configured
const FB_READY = FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY";
let db, auth;
if(FB_READY){
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  auth = firebase.auth();
  // Enable offline persistence
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
}

// ─── State ───
const ALL_OPS={
  add:{sym:"+",name:"Addition",cat:"int"},sub:{sym:"−",name:"Subtraction",cat:"int"},
  mul:{sym:"×",name:"Multiplication",cat:"int"},div:{sym:"÷",name:"Division",cat:"int"},
  decAdd:{sym:".+",name:"Dec Add/Sub",cat:"adv"},decMul:{sym:".×",name:"Dec Mul/Div",cat:"adv"},
  pct:{sym:"%",name:"Percentage",cat:"adv"},frac:{sym:"⅓",name:"Fractions",cat:"adv"},
};
const OP_SYM=k=>ALL_OPS[k]?.sym||k;
const OP_NAME=k=>ALL_OPS[k]?.name||k;
const DURS=[60,120,180,300];
const DEF={duration:120,ops:{add:true,sub:true,mul:true,div:true,decAdd:false,decMul:false,pct:false,frac:false},r:{addLo:2,addHi:100,subLo:2,subHi:100,mulLo:2,mulHi:12,divLo:2,divHi:12}};

let cfg=lls("md6-c",DEF);
cfg={...DEF,...cfg,ops:{...DEF.ops,...(cfg.ops||{})},r:{...DEF.r,...(cfg.r||{})}};
let hist=lls("md6-h",[]);
let streakData=lls("md6-s",{current:0,best:0,lastDate:null});
let currentUser=null, userProfile=null, friends=[];
let view="loading",tab="home";
let problem=null,input="",score=0,total=0,timeLeft=0;
let log=[],byOp={},probStart=0,timerId=null,logOpen=false;
let liveStreak=0,bestLiveStreak=0;

function lls(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb}catch{return fb}}
function sls(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
const round2=n=>Math.round(n*100)/100;
const pick=arr=>arr[rand(0,arr.length-1)];
const today=()=>new Date().toISOString().split("T")[0];
const $=id=>document.getElementById(id);
const app=$("app");

// ─── Auth ───
function initAuth(){
  if(!FB_READY){view="menu";render();return}
  auth.onAuthStateChanged(async user=>{
    if(user){
      currentUser=user;
      await loadProfile();
      await syncFromCloud();
      view="menu";
    }else{
      currentUser=null;userProfile=null;
      view="auth";
    }
    render();
  });
}

async function loadProfile(){
  if(!currentUser)return;
  try{
    const doc=await db.collection("users").doc(currentUser.uid).get();
    if(doc.exists){userProfile=doc.data()}
    else{
      // Create profile
      const code=genFriendCode();
      userProfile={name:currentUser.displayName||currentUser.email?.split("@")[0]||"Player",code,friends:[],createdAt:Date.now()};
      await db.collection("users").doc(currentUser.uid).set(userProfile);
    }
  }catch(e){console.error("Profile load error:",e)}
}

function genFriendCode(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let c="";for(let i=0;i<6;i++)c+=chars[rand(0,chars.length-1)];
  return c;
}

async function syncFromCloud(){
  if(!currentUser)return;
  try{
    const snap=await db.collection("users").doc(currentUser.uid).collection("sessions").orderBy("ts","desc").limit(200).get();
    if(!snap.empty){
      const cloudHist=snap.docs.map(d=>d.data());
      // Merge: use cloud as source of truth
      const local=new Set(hist.map(h=>h.ts));
      cloudHist.forEach(h=>{if(!local.has(h.ts))hist.push(h)});
      hist.sort((a,b)=>a.ts-b.ts);
      hist=hist.slice(-200);
      sls("md6-h",hist);
    }
    // Sync streak
    const sd=await db.collection("users").doc(currentUser.uid).collection("meta").doc("streak").get();
    if(sd.exists){
      const cloud=sd.data();
      if((cloud.current||0)>=(streakData.current||0)){streakData=cloud;sls("md6-s",streakData)}
    }
  }catch(e){console.error("Sync error:",e)}
}

async function saveSessionCloud(entry){
  if(!currentUser)return;
  try{
    await db.collection("users").doc(currentUser.uid).collection("sessions").add(entry);
    // Update user summary for leaderboard
    const best=Math.max(...hist.map(h=>h.score),entry.score);
    const totalSessions=hist.length;
    await db.collection("users").doc(currentUser.uid).update({
      bestScore:best,totalSessions,lastPlayed:Date.now(),
      dailyStreak:streakData.current,bestStreak:streakData.best,
      bestLiveStreak:Math.max(userProfile?.bestLiveStreak||0,bestLiveStreak)
    });
    userProfile.bestScore=best;
    userProfile.bestLiveStreak=Math.max(userProfile?.bestLiveStreak||0,bestLiveStreak);
  }catch(e){console.error("Save error:",e)}
}

async function saveStreakCloud(){
  if(!currentUser)return;
  try{await db.collection("users").doc(currentUser.uid).collection("meta").doc("streak").set(streakData)}catch{}
}

// ─── Daily Streak ───
function updateDailyStreak(){
  const t=today();
  if(streakData.lastDate===t)return; // Already played today
  const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
  const y=yesterday.toISOString().split("T")[0];
  if(streakData.lastDate===y){
    streakData.current++;
  }else if(streakData.lastDate!==t){
    streakData.current=1; // Reset
  }
  streakData.lastDate=t;
  if(streakData.current>streakData.best)streakData.best=streakData.current;
  sls("md6-s",streakData);
  saveStreakCloud();
}

// ─── Friends ───
async function addFriendByCode(code){
  if(!currentUser||!FB_READY)return"Login required";
  code=code.toUpperCase().trim();
  if(code===userProfile?.code)return"That's your own code";
  try{
    const snap=await db.collection("users").where("code","==",code).limit(1).get();
    if(snap.empty)return"Code not found";
    const friendUid=snap.docs[0].id;
    if(userProfile.friends?.includes(friendUid))return"Already friends";
    const friendList=[...(userProfile.friends||[]),friendUid];
    await db.collection("users").doc(currentUser.uid).update({friends:friendList});
    userProfile.friends=friendList;
    // Add reverse
    const friendData=snap.docs[0].data();
    const theirFriends=[...(friendData.friends||[]),currentUser.uid];
    await db.collection("users").doc(friendUid).update({friends:theirFriends});
    return"ok";
  }catch(e){return"Error: "+e.message}
}

async function loadFriends(){
  if(!currentUser||!userProfile?.friends?.length)return[];
  try{
    const results=[];
    // Firestore "in" queries support max 10
    const chunks=[];
    const fl=userProfile.friends;
    for(let i=0;i<fl.length;i+=10)chunks.push(fl.slice(i,i+10));
    for(const chunk of chunks){
      const snap=await db.collection("users").where(firebase.firestore.FieldPath.documentId(),"in",chunk).get();
      snap.forEach(d=>results.push({uid:d.id,...d.data()}));
    }
    return results;
  }catch{return[]}
}

// ─── Problem Generation ───
const FRACS=[[1,2,.5],[1,3,.3333],[2,3,.6667],[1,4,.25],[3,4,.75],[1,5,.2],[2,5,.4],[3,5,.6],[4,5,.8],[1,6,.1667],[5,6,.8333],[1,8,.125],[3,8,.375],[5,8,.625],[7,8,.875],[1,10,.1],[3,10,.3],[7,10,.7],[9,10,.9]];

function gen(){
  const pool=Object.entries(cfg.ops).filter(([,v])=>v).map(([k])=>k);
  if(!pool.length)return{text:"0 + 0",answer:0,op:"add",dec:false};
  const op=pick(pool);const r=cfg.r;let a,b,answer,text,dec=false;
  switch(op){
    case"add":a=rand(r.addLo,r.addHi);b=rand(r.addLo,r.addHi);text=`${a} + ${b}`;answer=a+b;break;
    case"sub":a=rand(r.subLo,r.subHi);b=rand(r.subLo,a);text=`${a} − ${b}`;answer=a-b;break;
    case"mul":a=rand(r.mulLo,r.mulHi);b=rand(r.mulLo,r.mulHi);text=`${a} × ${b}`;answer=a*b;break;
    case"div":b=rand(Math.max(2,r.divLo),r.divHi);answer=rand(r.divLo,r.divHi);a=b*answer;text=`${a} ÷ ${b}`;break;
    case"decAdd":{dec=true;const sub=Math.random()<.5;a=round2(rand(10,999)/10);b=round2(rand(10,999)/10);if(sub&&b>a)[a,b]=[b,a];text=sub?`${a} − ${b}`:`${a} + ${b}`;answer=round2(sub?a-b:a+b);break}
    case"decMul":{dec=true;if(Math.random()<.5){b=round2(rand(12,99)/10);answer=rand(2,30);a=round2(b*answer);text=`${a} ÷ ${b}`}else{a=round2(rand(11,99)/10);b=round2(rand(11,99)/10);answer=round2(a*b);text=`${a} × ${b}`}break}
    case"pct":{dec=true;const p=pick([5,10,12.5,15,20,25,30,33.33,40,50,60,66.67,75,80,90]);const base=pick([20,25,30,40,50,60,75,80,100,120,150,200,250,300,400,500,800,1000]);answer=round2(p*base/100);text=`${p}% of ${base}`;break}
    case"frac":{dec=true;const mode=rand(0,2);const f=pick(FRACS);
      if(mode===0){text=`${f[0]}/${f[1]} = ?`;answer=round2(f[2])}
      else if(mode===1){const base=pick([12,16,20,24,25,30,32,36,40,48,50,60,64,72,80,96,100,120,150,200]);answer=round2(f[2]*base);text=`${f[0]}/${f[1]} of ${base}`}
      else{const n=rand(2,12);answer=round2(n*f[2]);text=`${n} × ${f[0]}/${f[1]}`}break}
  }
  return{text,answer,op,dec};
}

function checkAnswer(v,correct,isDec){
  if(isDec){const u=parseFloat(v);return!isNaN(u)&&Math.abs(u-correct)<0.015}
  return parseInt(v,10)===correct;
}
function fmtAns(a,d){if(d){const s=a.toString();if(s.includes(".")&&s.split(".")[1].length>4)return a.toFixed(4).replace(/0+$/,"").replace(/\.$/,"");return s}return a.toString()}
function hasDecOps(){return cfg.ops.decAdd||cfg.ops.decMul||cfg.ops.pct||cfg.ops.frac}

// ─── Analysis ───
function analyze(){
  const last10=hist.slice(-10);if(last10.length<2)return null;
  const ops={};
  last10.forEach(s=>{if(!s.byOp)return;Object.entries(s.byOp).forEach(([op,d])=>{
    if(!ops[op])ops[op]={c:0,t:0,ms:0,n:0};ops[op].c+=d.c;ops[op].t+=d.t;
    if(d.avgMs){ops[op].ms+=d.avgMs*d.t;ops[op].n+=d.t}})});
  const analysis=Object.entries(ops).map(([op,d])=>({op,acc:d.t?d.c/d.t:0,avgMs:d.n?d.ms/d.n:0,t:d.t,c:d.c})).sort((a,b)=>a.acc-b.acc);
  const insights=[];
  const weak=analysis.filter(a=>a.acc<.85&&a.t>=5);
  if(weak.length){const w=weak[0];insights.push({type:"accuracy",sev:w.acc<.6?"high":"medium",msg:`${OP_NAME(w.op)} weakest at ${Math.round(w.acc*100)}%. Focus drills here.`})}
  const slow=[...analysis].sort((a,b)=>b.avgMs-a.avgMs).filter(a=>a.avgMs>3000);
  if(slow.length){const s=slow[0];insights.push({type:"speed",sev:s.avgMs>5000?"high":"medium",msg:`${OP_NAME(s.op)} slowest at ~${(s.avgMs/1000).toFixed(1)}s/problem.`})}
  const allAcc=analysis.length?analysis.reduce((a,x)=>a+x.acc,0)/analysis.length:0;
  let rd="Warming Up",rc="#f97316";
  if(allAcc>.95&&hist.length>=10){rd="Interview Ready";rc="#4ade80"}
  else if(allAcc>.85){rd="Getting Sharp";rc="#facc15"}
  else if(allAcc>.7){rd="Building Speed"}
  return{analysis,insights,rd,rc};
}

// ─── SVG Charts ───
function svgChart(data,key,color,h=130){
  if(!data.length)return"";const w=320,pad=30,gw=w-pad*2,gh=h-30;
  const vals=data.map(d=>d[key]);const mn=Math.min(...vals),mx=Math.max(...vals)||1;const range=mx-mn||1;
  const pts=data.map((d,i)=>({x:pad+(i/(data.length-1||1))*gw,y:h-15-(((d[key]-mn)/range)*gh)}));
  const pathD=pts.map((p,i)=>i===0?`M${p.x},${p.y}`:`L${p.x},${p.y}`).join(" ");
  const areaD=pathD+` L${pts[pts.length-1].x},${h-15} L${pts[0].x},${h-15} Z`;
  const labels=data.length<=8?data:data.filter((_,i)=>i===0||i===data.length-1||i===Math.floor(data.length/2));
  const lh=labels.map(d=>{const i=data.indexOf(d);const x=pad+(i/(data.length-1||1))*gw;return`<text x="${x}" y="${h}" fill="#3f3f46" font-size="9" text-anchor="middle" font-family="var(--f)">${d.label||""}</text>`}).join("");
  const yL=[mn,mn+(mx-mn)/2,mx].map(v=>{const y=h-15-(((v-mn)/range)*gh);return`<text x="${pad-4}" y="${y+3}" fill="#3f3f46" font-size="9" text-anchor="end" font-family="var(--f)">${Math.round(v*10)/10}</text><line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="#1a1a1a" stroke-dasharray="3,3"/>`}).join("");
  return`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${yL}${lh}<path d="${areaD}" fill="${color}" fill-opacity="0.15"/><path d="${pathD}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="${color}"/>`).join("")}</svg>`;
}
function opBarsSvg(analysis){
  const h=analysis.length*36+8,w=320;
  return`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${analysis.map((a,i)=>{
    const y=i*36+4;const pct=Math.round(a.acc*100);const color=pct>90?"#4ade80":pct>75?"#facc15":"#ef4444";const bw=(pct/100)*(w-90);
    return`<text x="10" y="${y+20}" fill="#a1a1aa" font-size="12" font-weight="700" font-family="var(--f)">${OP_SYM(a.op)}</text><rect x="42" y="${y+8}" width="${w-90}" height="14" rx="4" fill="#1a1a1a"/><rect x="42" y="${y+8}" width="${bw}" height="14" rx="4" fill="${color}"/><text x="${w-30}" y="${y+20}" fill="#a1a1aa" font-size="12" font-weight="600" text-anchor="end" font-family="var(--f)">${pct}%</text>`}).join("")}</svg>`;
}

  }
  if(tab==="progress"){
    $("clearHistBtn")?.addEventListener("click",()=>{if(confirm("Clear all progress?")){hist=[];sls("md6-h",[]);render()}});
  }
  if(tab==="compete"){
    $("compLoginBtn")?.addEventListener("click",()=>{view="auth";render()});
    $("copyCodeBtn")?.addEventListener("click",()=>{
      navigator.clipboard?.writeText(userProfile?.code||"").then(()=>{$("copyCodeBtn").textContent="Copied!";setTimeout(()=>{const b=$("copyCodeBtn");if(b)b.textContent="Copy Code"},1500)}).catch(()=>{})
    });
    $("addFriendBtn")?.addEventListener("click",async()=>{
      const code=$("friendCodeInput")?.value;if(!code)return;
      const res=await addFriendByCode(code);
      const err=$("friendErr");
      if(res==="ok"){if(err)err.style.color="var(--grn)";if(err)err.textContent="Friend added!";loadAndRenderLB()}
      else{if(err)err.style.color="var(--red)";if(err)err.textContent=res}
    });
    // Load leaderboard
    if(currentUser)loadAndRenderLB();
  }
}

async function loadAndRenderLB(){
  const container=$("lbContainer");if(!container)return;
  container.innerHTML=`<div style="color:var(--d);font-size:12px">Loading…</div>`;
  const friendData=await loadFriends();

  // Add self
  const entries=[{
    name:userProfile?.name||"You",
    bestScore:Math.max(...hist.map(h=>h.score),0),
    dailyStreak:streakData.current,
    bestLiveStreak:lls("md6-bls",0),
    isMe:true
  }];
  friendData.forEach(f=>entries.push({
    name:f.name||"Friend",
    bestScore:f.bestScore||0,
    dailyStreak:f.dailyStreak||0,
    bestLiveStreak:f.bestLiveStreak||0,
    isMe:false
  }));
  entries.sort((a,b)=>b.bestScore-a.bestScore);

  if(entries.length<=1&&!friendData.length){
    container.innerHTML=`<div style="color:var(--d);font-size:12px;text-align:center">Share your code with friends to compete!</div>`;
    return;
  }

  const medals=["🥇","🥈","🥉"];
  container.innerHTML=entries.map((e,i)=>`
    <div class="lb-row${e.isMe?" lb-me":""}">
      <div class="lb-rank">${medals[i]||i+1}</div>
      <div class="lb-name">${e.name}${e.isMe?" (you)":""}</div>
      <div style="display:flex;flex-direction:column;align-items:flex-end">
        <div class="lb-val">${e.bestScore}</div>
        <div style="font-size:9px;color:var(--d)">${e.dailyStreak}🔥 · ${e.bestLiveStreak}⚡</div>
      </div>
    </div>`).join("");
}

// ─── Game Flow ───
function renderCountdown(){
  let n=3;
  app.innerHTML=`<div class="countdown-num" id="cn">${n}</div>`;
  const iv=setInterval(()=>{n--;if(n<=0){clearInterval(iv);startGame();return}const el=$("cn");if(el){el.textContent=n;el.style.animation="none";el.offsetHeight;el.style.animation="cpulse .6s ease-in-out"}},600);
}

function startGame(){
  score=0;total=0;log=[];byOp={};logOpen=false;
  liveStreak=0;bestLiveStreak=0;
  timeLeft=cfg.duration;problem=gen();input="";probStart=Date.now();
  view="game";renderGame();
  timerId=setInterval(()=>{timeLeft--;if(timeLeft<=0){clearInterval(timerId);timerId=null;endGame();return}
    const te=$("timer");if(te){te.textContent=fmt(timeLeft);te.className=timeLeft<=10?"hud-timer urgent":"hud-timer"}
    const pf=$("progFill");if(pf){const p=((cfg.duration-timeLeft)/cfg.duration)*100;pf.style.width=p+"%";if(timeLeft<=10)pf.classList.add("urgent")}
  },1000);
}

function endGame(){
  if(timerId){clearInterval(timerId);timerId=null}
  updateDailyStreak();
  // Save best live streak
  const prevBls=lls("md6-bls",0);
  if(bestLiveStreak>prevBls)sls("md6-bls",bestLiveStreak);

  const entry={ts:Date.now(),score,total,duration:cfg.duration,byOp:{...byOp},bestStreak:bestLiveStreak};
  hist.push(entry);if(hist.length>200)hist=hist.slice(-200);sls("md6-h",hist);
  saveSessionCloud(entry);
  view="result";render();
}

function renderGame(){
  const pct=((cfg.duration-timeLeft)/cfg.duration)*100;const urg=timeLeft<=10&&timeLeft>0;
  const imode=hasDecOps()?"decimal":"numeric";
  app.innerHTML=`
    <div class="prog-bar"><div class="prog-fill${urg?" urgent":""}" id="progFill" style="width:${pct}%"></div></div>
    <div class="game-hud"><span class="hud-timer${urg?" urgent":""}" id="timer">${fmt(timeLeft)}</span><div style="display:flex;flex-direction:column;align-items:flex-end"><span class="hud-score-num" id="scoreNum">${score}</span><span class="hud-score-label">correct</span></div></div>
    <div class="live-streak"><span class="live-streak-num" id="lsNum">${liveStreak}</span><br><span class="live-streak-label">streak</span></div>
    <div class="game-body"><div class="game-q" id="qText">${problem.text}</div><div class="game-eq">=</div>
    <input inputmode="${imode}" pattern="[0-9.\\-]*" class="game-input" id="gi" value="${input}" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go"></div>
    <button class="skip-link" id="skipBtn">skip →</button>`;

  const gi=$("gi");setTimeout(()=>gi?.focus(),50);

  gi.addEventListener("keydown",e=>{if(e.key==="Enter"&&input.trim()){
    if(checkAnswer(input,problem.answer,problem.dec)){correctAnswer()}
  }});

  gi.oninput=e=>{
    let v=e.target.value;if(!/^-?[\d.]*$/.test(v)){e.target.value=input;return}input=v;
    if(!problem.dec){if(v==="-"||v==="")return;if(!/^-?\d+$/.test(v))return;if(parseInt(v,10)===problem.answer)correctAnswer()}
    if(problem.dec&&v.includes(".")&&v.length>=2&&!v.endsWith(".")){if(checkAnswer(v,problem.answer,true))correctAnswer()}
  };
  $("skipBtn").onclick=()=>{
    const ms=Date.now()-probStart;total++;recOp(problem.op,false,ms);
    log.push({q:problem.text,a:fmtAns(problem.answer,problem.dec),ok:false,ms});
    liveStreak=0;updateLiveStreakUI();
    nextProblem();
  };
  app.onclick=e=>{if(e.target.id!=="skipBtn")gi?.focus()};
}

function correctAnswer(){
  const ms=Date.now()-probStart;try{navigator.vibrate?.(15)}catch{}
  score++;total++;recOp(problem.op,true,ms);
  log.push({q:problem.text,a:fmtAns(problem.answer,problem.dec),ok:true,ms});
  liveStreak++;if(liveStreak>bestLiveStreak)bestLiveStreak=liveStreak;
  updateLiveStreakUI();
  nextProblem();
}

function updateLiveStreakUI(){
  const el=$("lsNum");if(!el)return;
  el.textContent=liveStreak;
  if(liveStreak>0){el.style.color=liveStreak>=10?"var(--grn)":liveStreak>=5?"var(--gold)":"var(--acc)";
    el.classList.remove("pop");el.offsetHeight;el.classList.add("pop")}
  else{el.style.color="var(--d)"}
}

function recOp(op,ok,ms){
  if(!byOp[op])byOp[op]={c:0,t:0,totalMs:0};
  byOp[op].c+=ok?1:0;byOp[op].t++;byOp[op].totalMs+=ms;byOp[op].avgMs=byOp[op].totalMs/byOp[op].t;
}

function nextProblem(){
  problem=gen();input="";probStart=Date.now();
  const q=$("qText");if(q)q.textContent=problem.text;
  const gi=$("gi");if(gi){gi.value="";gi.focus()}
  const sn=$("scoreNum");if(sn)sn.textContent=score;
}

function renderResult(){
  const acc=total?Math.round(score/total*100):0;
  const spd=cfg.duration?(score/(cfg.duration/60)).toFixed(1):0;
  const okLog=log.filter(l=>l.ok);
  const avgMs=okLog.length?okLog.reduce((a,l)=>a+l.ms,0)/okLog.length:0;
  const wa=analyze();

  let opH="";
  if(Object.keys(byOp).length){
    opH=`<div class="op-rows">${Object.entries(byOp).map(([op,d])=>{
      const p=d.t?Math.round(d.c/d.t*100):0;const ms=(d.totalMs/d.t/1000).toFixed(1);
      const col=p>90?"var(--grn)":p>75?"var(--gold)":"var(--red)";
      return`<div class="op-row"><span class="op-sym">${OP_SYM(op)}</span><div class="op-bar"><div class="op-fill" style="width:${p}%;background:${col}"></div></div><span class="op-pct">${p}%</span><span class="op-ms">${ms}s</span></div>`}).join("")}</div>`;
  }

  let insH="";if(wa?.insights?.[0]){const i=wa.insights[0];insH=`<div class="insight ${i.sev}"><div class="insight-icon">${{accuracy:"◎",speed:"⏱",trend:"↗"}[i.type]||"•"}</div><div class="insight-text">${i.msg}</div></div>`}

  let logH="";
  if(log.length)logH=`<button class="log-toggle" id="logToggle">▸ View all ${log.length} problems</button><div class="log-box hide" id="logBox">${log.map(h=>`<div class="log-item" style="color:${h.ok?"var(--grn)":"var(--red)"}"><span>${h.q} = ${h.a}</span><span style="font-size:10px;opacity:.6">${h.ok?(h.ms/1000).toFixed(1)+"s":"skipped"}</span></div>`).join("")}</div>`;

  const playedToday=streakData.lastDate===today();
  const streakMsg=playedToday?`🔥 ${streakData.current} day streak!`:"";

  app.innerHTML=`<div class="card" style="max-width:440px">
    <div class="result-score">${score}</div><div class="result-sub">correct in ${fmt(cfg.duration)}</div>
    ${streakMsg?`<div style="font-size:13px;color:var(--acc);margin-bottom:4px">${streakMsg}</div>`:""}
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-val">${total}</div><div class="stat-key">Attempted</div></div>
      <div class="stat-card"><div class="stat-val">${acc}%</div><div class="stat-key">Accuracy</div></div>
      <div class="stat-card"><div class="stat-val">${spd}</div><div class="stat-key">Per Min</div></div>
      <div class="stat-card"><div class="stat-val">${bestLiveStreak}⚡</div><div class="stat-key">Best Streak</div></div>
    </div>
    ${opH}${insH}${logH}
    <button class="btn-p" id="againBtn">Play Again</button>
    <button class="btn-g" id="menuBtn">Menu</button>
  </div>`;
  $("againBtn").onclick=()=>{view="countdown";render()};
  $("menuBtn").onclick=()=>{view="menu";tab="home";render()};
  const lt=$("logToggle");if(lt)lt.onclick=()=>{logOpen=!logOpen;const lb=$("logBox");if(lb)lb.classList.toggle("hide");lt.textContent=(logOpen?"▾":"▸")+` View all ${log.length} problems`};
}

// ─── Boot ───
if(FB_READY){initAuth()}else{view="menu";render()}
</script>
