<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MathDrill Pro</title>
<!-- PWA Meta -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a0a0a'/><text x='50' y='68' font-size='52' text-anchor='middle'>⚡</text></svg>">

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap');
:root{
  --bg:#0a0a0a;--s:#111;--b:#1a1a1a;--b2:#1f1f1f;--t:#e4e4e7;
  --m:#71717a;--d:#3f3f46;--dm:#27272a;--acc:#f97316;--gold:#facc15;
  --red:#ef4444;--grn:#4ade80;--cyan:#22d3ee;
  --f:'JetBrains Mono',monospace;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,20px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);font-family:var(--f);height:100vh;overflow:hidden;user-select:none;-webkit-user-select:none}

#app{height:100%;display:flex;flex-direction:column;align-items:center;padding-top:var(--st)}
.card{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1}}

/* Brand */
.brand-name{font-size:32px;font-weight:800;letter-spacing:-2px;background:linear-gradient(135deg,#facc15,#f97316,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* Buttons */
.btn-p{width:100%;max-width:320px;padding:16px;border-radius:14px;background:linear-gradient(135deg,#facc15,#f97316);color:var(--bg);font-weight:800;border:none;cursor:pointer}
.btn-optiver{background:linear-gradient(135deg,#1e3a8a,#3b82f6);color:white}
.btn-g{background:var(--s);border:1px solid var(--b2);color:var(--m);padding:12px;border-radius:12px;width:100%;max-width:320px}

/* Game UI */
.game-container{flex:1;width:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative}
.q-display{font-size:48px;font-weight:800;margin-bottom:10px;text-align:center}
.a-display{font-size:54px;min-height:64px;color:var(--acc);font-weight:700;border-bottom:3px solid var(--b2);min-width:180px;text-align:center;margin-bottom:30px}
.a-display.wrong{color:var(--red);animation:shake 0.2s ease-in-out 0s 2}
@keyframes shake{0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)}}

/* Numpad */
.numpad{width:100%;max-width:400px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;background:var(--s);border-top:1px solid var(--b);padding-bottom:var(--sb)}
.num-btn{background:var(--b);border:1px solid var(--b2);color:var(--t);font-size:24px;font-weight:600;padding:20px 0;border-radius:12px;display:flex;justify-content:center;align-items:center}
.num-btn:active{background:var(--b2);transform:scale(0.95)}
.num-btn.action{background:var(--dm);color:var(--m)}
.num-btn.enter{background:var(--acc);color:var(--bg)}

/* HUD */
.hud{position:absolute;top:20px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-start}
.stat-box{display:flex;flex-direction:column}
.stat-label{font-size:10px;color:var(--d);text-transform:uppercase;letter-spacing:1px}
.stat-val{font-size:22px;font-weight:800}

/* Rank Tag */
.rank-tag{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:800;text-transform:uppercase;margin-top:4px}
.rank-legendary{background:#7c3aed;color:white}
.rank-senior{background:var(--gold);color:var(--bg)}
.rank-junior{background:var(--cyan);color:var(--bg)}

/* Hide Utilities */
.hide{display:none!important}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

const FIREBASE_CONFIG = {
  apiKey: "YOUR_API_KEY", // Replace with yours
  authDomain: "mathdrill-9da20.firebaseapp.com",
  projectId: "mathdrill-9da20",
  storageBucket: "mathdrill-9da20.firebasestorage.app",
  messagingSenderId: "1003675186914",
  appId: "1:1003675186914:web:2ba46111409647c163d0bb"
};

const FB_READY = FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY";
let db, auth;
if(FB_READY){
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  auth = firebase.auth();
}

// ─── State ───
const DEF_CFG = {
  duration: 120,
  mode: 'standard', // 'standard' or 'optiver'
  ops: {add:true, sub:true, mul:true, div:true, decAdd:false, decMul:false, pct:false, frac:false},
  r: {addLo:2, addHi:100, subLo:2, subHi:100, mulLo:2, mulHi:12, divLo:2, divHi:12}
};

let cfg = JSON.parse(localStorage.getItem("md-pro-cfg")) || DEF_CFG;
let hist = JSON.parse(localStorage.getItem("md-pro-hist")) || [];
let view = "menu";
let problem = null;
let input = "";
let score = 0;
let total = 0;
let timeLeft = 0;
let optiverLeft = 80;
let timerId = null;
let sessionLog = [];

// ─── Utilities ───
const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = (arr) => arr[rand(0, arr.length - 1)];
const $ = id => document.getElementById(id);

function getRank(scorePerMin, accuracy) {
  const rating = scorePerMin * (accuracy / 100);
  if (rating > 50) return { name: "Market Maker Legend", class: "rank-legendary" };
  if (rating > 35) return { name: "Senior Trader", class: "rank-senior" };
  if (rating > 20) return { name: "Junior Trader", class: "rank-junior" };
  return { name: "Junior Researcher", class: "" };
}

// ─── Engine ───
function gen() {
  const pool = Object.entries(cfg.ops).filter(([,v]) => v).map(([k]) => k);
  const op = pick(pool) || "add";
  const r = cfg.r;
  let a, b, answer, text, dec = false;

  switch(op) {
    case "add": a=rand(r.addLo,r.addHi); b=rand(r.addLo,r.addHi); text=`${a} + ${b}`; answer=a+b; break;
    case "sub": a=rand(r.subLo,r.subHi); b=rand(r.subLo, a); text=`${a} - ${b}`; answer=a-b; break;
    case "mul": a=rand(r.mulLo,r.mulHi); b=rand(r.mulLo,r.mulHi); text=`${a} × ${b}`; answer=a*b; break;
    case "div": b=rand(Math.max(2, r.divLo), r.divHi); answer=rand(r.divLo, r.divHi); a=b*answer; text=`${a} ÷ ${b}`; break;
    // Simple Decimals for Pro
    case "decAdd": dec=true; a=(rand(10,99)/10); b=(rand(10,99)/10); text=`${a} + ${b}`; answer=Math.round((a+b)*10)/10; break;
  }
  return { text, answer, dec };
}

// ─── View Controller ───
function render() {
  const app = $("app");
  if (view === "menu") {
    app.innerHTML = `
      <div class="card">
        <div class="brand-name">MathDrill Pro</div>
        <p style="color:var(--m); font-size:12px; margin-bottom:20px">Quant Interview Mental Math Trainer</p>
        
        <button class="btn-p" onclick="startGame('standard')">Standard Drill (2m)</button>
        <button class="btn-p btn-optiver" onclick="startGame('optiver')">Optiver 80 in 8</button>
        
        <div style="width:100%; margin-top:20px">
           <p class="stat-label">Last Session</p>
           <p style="font-size:18px; font-weight:700">${hist.length ? hist[hist.length-1].score : '0'} Correct</p>
        </div>
      </div>
    `;
  } else if (view === "game") {
    const isOptiver = cfg.mode === 'optiver';
    app.innerHTML = `
      <div class="hud">
        <div class="stat-box">
          <span class="stat-label">Time</span>
          <span class="stat-val" id="timer">--:--</span>
        </div>
        <div class="stat-box" style="align-items:flex-end">
          <span class="stat-label">${isOptiver ? 'Points' : 'Score'}</span>
          <span class="stat-val" id="score">0</span>
        </div>
      </div>

      <div class="game-container">
        ${isOptiver ? `<div class="stat-label" style="margin-bottom:10px">${optiverLeft} Questions Left</div>` : ''}
        <div class="q-display">${problem.text}</div>
        <div class="a-display" id="answerDisplay"></div>
      </div>

      <div class="numpad">
        <div class="num-btn" onclick="press('1')">1</div>
        <div class="num-btn" onclick="press('2')">2</div>
        <div class="num-btn" onclick="press('3')">3</div>
        <div class="num-btn" onclick="press('4')">4</div>
        <div class="num-btn" onclick="press('5')">5</div>
        <div class="num-btn" onclick="press('6')">6</div>
        <div class="num-btn" onclick="press('7')">7</div>
        <div class="num-btn" onclick="press('8')">8</div>
        <div class="num-btn" onclick="press('9')">9</div>
        <div class="num-btn action" onclick="press('-')">-</div>
        <div class="num-btn" onclick="press('0')">0</div>
        <div class="num-btn action" onclick="press('.')">.</div>
        <div class="num-btn action" onclick="press('DEL')" style="grid-column: span 1">⌫</div>
        <div class="num-btn enter" onclick="press('ENT')" style="grid-column: span 2">ENTER</div>
      </div>
    `;
    updateHUD();
  } else if (view === "results") {
    const last = hist[hist.length-1];
    const spm = (last.score / (last.duration / 60)).toFixed(1);
    const acc = Math.round((last.correctCount / last.total) * 100) || 0;
    const rank = getRank(spm, acc);

    app.innerHTML = `
      <div class="card">
        <div class="stat-label">Session Complete</div>
        <div class="brand-name" style="font-size:64px">${last.score}</div>
        <div class="rank-tag ${rank.class}">${rank.name}</div>
        
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; margin-top:20px">
          <div class="btn-g"><span class="stat-label">Accuracy</span><br>${acc}%</div>
          <div class="btn-g"><span class="stat-label">Per Min</span><br>${spm}</div>
        </div>

        <button class="btn-p" onclick="view='menu';render()">Return Home</button>
      </div>
    `;
  }
}

// ─── Game Logic ───
function startGame(mode) {
  cfg.mode = mode;
  cfg.duration = mode === 'optiver' ? 480 : 120;
  timeLeft = cfg.duration;
  score = 0;
  total = 0;
  optiverLeft = mode === 'optiver' ? 80 : 999;
  sessionLog = [];
  view = "game";
  problem = gen();
  input = "";
  render();

  timerId = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) endGame();
    updateHUD();
  }, 1000);
}

function press(key) {
  const display = $("answerDisplay");
  if (!display) return;

  if (key === 'DEL') {
    input = input.slice(0, -1);
  } else if (key === 'ENT') {
    submit();
  } else {
    if (input.length < 8) input += key;
  }
  display.innerText = input;
}

function submit() {
  const userAns = parseFloat(input);
  const isCorrect = Math.abs(userAns - problem.answer) < 0.01;
  const display = $("answerDisplay");

  total++;
  if (isCorrect) {
    // Optiver Scoring: +1 per correct
    score += 1;
    if (cfg.mode === 'optiver') optiverLeft--;
    problem = gen();
    input = "";
    display.innerText = "";
    if (optiverLeft <= 0) endGame();
  } else {
    // Optiver Scoring: -2 per wrong
    if (cfg.mode === 'optiver') {
        score -= 2;
        optiverLeft--; // In Optiver, you move to next regardless
        problem = gen();
        input = "";
        display.innerText = "";
        if (optiverLeft <= 0) endGame();
    } else {
        // Standard mode: shake and clear
        display.classList.add("wrong");
        setTimeout(() => display.classList.remove("wrong"), 200);
        input = "";
        display.innerText = "";
    }
  }
  updateHUD();
  render(); // Re-renders to update question text and progress
}

function updateHUD() {
  const t = $("timer");
  const s = $("score");
  if (t) {
    const m = Math.floor(timeLeft / 60);
    const sec = timeLeft % 60;
    t.innerText = `${m}:${sec.toString().padStart(2, '0')}`;
  }
  if (s) s.innerText = score;
}

function endGame() {
  clearInterval(timerId);
  const session = {
    date: Date.now(),
    score: score,
    total: total,
    correctCount: cfg.mode === 'optiver' ? (score + (total - score)/3) : score, // Rough estimate for Optiver
    duration: cfg.duration,
    mode: cfg.mode
  };
  
  // Refine correctCount for Optiver (+1 for correct, -2 for wrong)
  // Let x = correct, y = wrong. x + y = total. x - 2y = score.
  // x - 2(total - x) = score => 3x - 2total = score => x = (score + 2*total) / 3
  if(cfg.mode === 'optiver') {
      session.correctCount = Math.round((score + 2 * total) / 3);
  }

  hist.push(session);
  localStorage.setItem("md-pro-hist", JSON.stringify(hist));
  
  // Firebase Sync
  if(FB_READY && auth.currentUser) {
      db.collection("users").doc(auth.currentUser.uid).collection("sessions").add(session);
  }

  view = "results";
  render();
}

// Physical Keyboard Support
window.addEventListener("keydown", (e) => {
    if (view !== "game") return;
    if (e.key >= "0" && e.key <= "9") press(e.key);
    if (e.key === ".") press(".");
    if (e.key === "-") press("-");
    if (e.key === "Backspace") press("DEL");
    if (e.key === "Enter") press("ENT");
});

// Boot
render();

</script>
</body>
</html>
