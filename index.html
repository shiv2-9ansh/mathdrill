<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>QuantDrill | High-Frequency</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap');
:root {
    --bg: #050505; --card: #111; --acc: #f97316; --text: #fafafa;
    --dim: #52525b; --err: #ef4444; --suc: #22c55e; --blue: #3b82f6; --font: 'JetBrains Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: var(--font); height: 100vh; overflow: hidden; }

/* Layout */
#app { height: 100%; display: flex; flex-direction: column; }
.nav { display: flex; background: var(--card); border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); }
.nav-item { flex: 1; padding: 16px; text-align: center; font-size: 10px; color: var(--dim); cursor: pointer; font-weight: 800; }
.nav-item.active { color: var(--acc); }

.screen { flex: 1; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; padding-top: env(safe-area-inset-top); }
.hide { display: none !important; }

/* Cards & Components */
.card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid #222; }
.btn { width: 100%; padding: 16px; border-radius: 10px; font-weight: 800; border: none; cursor: pointer; font-family: var(--font); margin-top: 8px; font-size: 14px; }
.btn-p { background: var(--acc); color: #000; }
.btn-s { background: #1a1a1a; color: var(--text); }

/* Analytics Elements */
.lat-bar-container { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.lat-label { width: 40px; font-size: 10px; color: var(--dim); text-transform: uppercase; }
.lat-bar-bg { flex: 1; height: 8px; background: #222; border-radius: 4px; overflow: hidden; }
.lat-bar-fill { height: 100%; background: var(--blue); border-radius: 4px; }
.lat-val { width: 45px; font-size: 10px; text-align: right; font-weight: 700; }

/* Game UI */
.q-text { font-size: 44px; font-weight: 800; text-align: center; margin: 40px 0 10px; letter-spacing: -1px; }
.a-input { font-size: 50px; color: var(--acc); font-weight: 800; text-align: center; border-bottom: 2px solid #222; min-height: 65px; margin-bottom: 20px; }
.a-input.wrong { color: var(--err); animation: shake 0.2s 2; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

.numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: #222; margin-top: auto; padding-bottom: env(safe-area-inset-bottom); }
.key { background: var(--bg); padding: 22px; font-size: 24px; font-weight: 600; text-align: center; cursor: pointer; }
.key:active { background: #111; }
.key.ent { background: var(--acc); color: #000; grid-column: span 2; font-weight: 800; }

.badge { font-size: 9px; padding: 2px 6px; border-radius: 4px; background: #222; color: var(--dim); vertical-align: middle; }
</style>
</head>
<body>

<div id="app">
    <!-- DASHBOARD -->
    <div id="screen-home" class="screen">
        <h2 style="margin-bottom:15px">QUANTDRILL <span class="badge">PRO</span></h2>
        <div class="card">
            <p style="font-size:10px; color:var(--dim)">CURRENT RANK</p>
            <h1 id="rank-display" style="color:var(--acc); margin-bottom:10px">ANALYZING...</h1>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
                <div class="btn-s" style="padding:10px; border-radius:8px">
                    <p style="font-size:9px; color:var(--dim)">TOTAL SOLVED</p>
                    <p id="stat-solved" style="font-weight:800">0</p>
                </div>
                <div class="btn-s" style="padding:10px; border-radius:8px">
                    <p style="font-size:9px; color:var(--dim)">AVG LATENCY</p>
                    <p id="stat-lat" style="font-weight:800">0.0s</p>
                </div>
            </div>
        </div>
        <button class="btn btn-p" onclick="startDrill('optiver')">OPTIVER 80/8</button>
        <button class="btn btn-s" onclick="switchTab('practice')">PRACTICE LAB</button>
    </div>

    <!-- ANALYTICS -->
    <div id="screen-analytics" class="screen hide">
        <h2 style="margin-bottom:15px">PERFORMANCE DEEP-DIVE</h2>
        
        <div class="card">
            <p style="font-size:10px; color:var(--dim); margin-bottom:10px">LATENCY BY OPERATION (SECONDS)</p>
            <div id="latency-bars">
                <!-- Bars injected here -->
            </div>
        </div>

        <div class="card">
            <p style="font-size:10px; color:var(--dim); margin-bottom:10px">ACCURACY HEATMAP</p>
            <div id="heatmap" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px"></div>
        </div>

        <button class="btn btn-s" style="color:var(--err)" onclick="resetData()">WIPE DATA</button>
    </div>

    <!-- PRACTICE -->
    <div id="screen-practice" class="screen hide">
        <h2>PRACTICE LAB</h2>
        <p style="font-size:11px; color:var(--dim); margin: 10px 0;">TARGET SPECIFIC WEAKNESSES</p>
        
        <div id="op-toggles" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px">
            <!-- Toggles injected here -->
        </div>

        <button class="btn btn-p" onclick="startDrill('custom')">START SESSION</button>
        <button class="btn btn-s" onclick="startDrill('weakness')" style="border:1px solid var(--blue); color:var(--blue)">DRILL SLOWEST OPS</button>
    </div>

    <!-- GAME -->
    <div id="screen-game" class="screen hide" style="padding:0">
        <div style="padding:20px">
            <div style="display:flex; justify-content:space-between; align-items:center">
                <p id="timer" style="font-weight:800; color:var(--acc)">8:00</p>
                <p id="score" style="font-weight:800">0</p>
            </div>
            <div class="q-text" id="q-text">--</div>
            <div class="a-input" id="a-input"></div>
        </div>
        <div class="numpad">
            <div class="key" onclick="press('1')">1</div><div class="key" onclick="press('2')">2</div><div class="key" onclick="press('3')">3</div>
            <div class="key" onclick="press('4')">4</div><div class="key" onclick="press('5')">5</div><div class="key" onclick="press('6')">6</div>
            <div class="key" onclick="press('7')">7</div><div class="key" onclick="press('8')">8</div><div class="key" onclick="press('9')">9</div>
            <div class="key" onclick="press('.')">.</div><div class="key" onclick="press('0')">0</div><div class="key" onclick="press('DEL')">DEL</div>
            <div class="key ent" onclick="press('ENT')">SUBMIT</div>
        </div>
    </div>

    <div class="nav" id="main-nav">
        <div class="nav-item active" onclick="switchTab('home')">DASHBOARD</div>
        <div class="nav-item" onclick="switchTab('analytics')">ANALYTICS</div>
        <div class="nav-item" onclick="switchTab('practice')">PRACTICE</div>
    </div>
</div>

<script>
"use strict";

// --- Data Model ---
const INITIAL_STATS = {
    totalSolved: 0,
    history: [], // {ts, score, type}
    ops: {
        add: {c:0, t:0, totalMs: 0},
        sub: {c:0, t:0, totalMs: 0},
        mul: {c:0, t:0, totalMs: 0},
        div: {c:0, t:0, totalMs: 0},
        pct: {c:0, t:0, totalMs: 0},
        sq:  {c:0, t:0, totalMs: 0}
    }
};

let stats = JSON.parse(localStorage.getItem('qd_pro_v4')) || INITIAL_STATS;
let activeOps = ['add', 'sub', 'mul', 'div'];
let game = { active: false, timer: null, currentProb: null };

const save = () => localStorage.setItem('qd_pro_v4', JSON.stringify(stats));

// --- Math Engine ---
function generateProblem() {
    let opPool = activeOps;
    
    // If in weakness drill, only pick from ops with latency > 3s or accuracy < 80%
    if (game.type === 'weakness') {
        opPool = Object.keys(stats.ops).filter(o => {
            const avg = stats.ops[o].t ? (stats.ops[o].totalMs / stats.ops[o].t) / 1000 : 0;
            return avg > 2.5 || (stats.ops[o].t > 0 && stats.ops[o].c / stats.ops[o].t < 0.85);
        });
        if (opPool.length === 0) opPool = activeOps;
    }

    const op = opPool[Math.floor(Math.random() * opPool.length)];
    let a, b, ans, txt;

    switch(op) {
        case 'add': a=rand(10,99); b=rand(10,99); ans=a+b; txt=`${a}+${b}`; break;
        case 'sub': a=rand(20,150); b=rand(10,a); ans=a-b; txt=`${a}-${b}`; break;
        case 'mul': a=rand(2,16); b=rand(2,20); ans=a*b; txt=`${a}×${b}`; break;
        case 'div': b=rand(2,12); ans=rand(2,15); a=b*ans; txt=`${a}÷${b}`; break;
        case 'pct': a=[5,10,15,20,25,50][Math.floor(Math.random()*6)]; b=rand(1,20)*20; ans=(a/100)*b; txt=`${a}% of ${b}`; break;
        case 'sq': a=rand(2,25); ans=a*a; txt=`${a}²`; break;
    }
    return { op, txt, ans, start: Date.now() };
}

const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

// --- UI Logic ---
function switchTab(tab) {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hide'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById(`screen-${tab}`).classList.remove('hide');
    event?.target.classList?.add('active');
    
    if (tab === 'home') renderHome();
    if (tab === 'analytics') renderAnalytics();
    if (tab === 'practice') renderPractice();
}

function renderHome() {
    const solved = Object.values(stats.ops).reduce((a,b) => a + b.c, 0);
    const totalMs = Object.values(stats.ops).reduce((a,b) => a + b.totalMs, 0);
    const avgLat = solved ? (totalMs / solved / 1000).toFixed(2) : "0.00";
    
    document.getElementById('stat-solved').innerText = solved;
    document.getElementById('stat-lat').innerText = avgLat + "s";
    
    let rank = "TRAINEE";
    if (solved > 50) rank = "JUNIOR TRADER";
    if (solved > 250 && avgLat < 2.5) rank = "ASSOCIATE TRADER";
    if (solved > 700 && avgLat < 1.8) rank = "MARKET MAKER";
    document.getElementById('rank-display').innerText = rank;
}

function renderAnalytics() {
    const container = document.getElementById('latency-bars');
    const heatmap = document.getElementById('heatmap');
    container.innerHTML = ""; heatmap.innerHTML = "";

    Object.entries(stats.ops).forEach(([name, data]) => {
        const avg = data.t ? (data.totalMs / data.t / 1000) : 0;
        const acc = data.t ? (data.c / data.t) : 0;

        // Latency Bars
        const width = Math.min(avg * 20, 100); // Scale 5 seconds to 100%
        container.innerHTML += `
            <div class="lat-bar-container">
                <div class="lat-label">${name}</div>
                <div class="lat-bar-bg"><div class="lat-bar-fill" style="width:${width}%; background:${avg > 3 ? 'var(--err)' : 'var(--blue)'}"></div></div>
                <div class="lat-val">${avg.toFixed(2)}s</div>
            </div>`;
        
        // Heatmap
        const color = data.t === 0 ? '#111' : acc > 0.9 ? 'var(--suc)' : acc > 0.7 ? 'var(--acc)' : 'var(--err)';
        heatmap.innerHTML += `<div style="background:${color}; padding:10px; border-radius:8px; text-align:center; font-size:10px; color:#000; font-weight:800">${name.toUpperCase()}<br>${Math.round(acc*100)}%</div>`;
    });
}

function renderPractice() {
    const grid = document.getElementById('op-toggles');
    grid.innerHTML = "";
    Object.keys(INITIAL_STATS.ops).forEach(op => {
        const isOn = activeOps.includes(op);
        grid.innerHTML += `<div class="btn-s ${isOn?'':'hide-op'}" style="padding:15px; border:1px solid ${isOn?'var(--acc)':'#222'}" onclick="toggleOp('${op}')">${op.toUpperCase()}</div>`;
    });
}

function toggleOp(op) {
    if (activeOps.includes(op)) activeOps = activeOps.filter(o => o !== op);
    else activeOps.push(op);
    renderPractice();
}

// --- Game Loop ---
function startDrill(type) {
    game = { active: true, type, score: 0, timeLeft: type === 'optiver' ? 480 : 120 };
    document.getElementById('screen-game').classList.remove('hide');
    document.getElementById('main-nav').classList.add('hide');
    nextQ();
    
    game.timer = setInterval(() => {
        game.timeLeft--;
        const m = Math.floor(game.timeLeft / 60);
        const s = game.timeLeft % 60;
        document.getElementById('timer').innerText = `${m}:${s.toString().padStart(2, '0')}`;
        if (game.timeLeft <= 0) endGame();
    }, 1000);
}

function nextQ() {
    game.currentProb = generateProblem();
    document.getElementById('q-text').innerText = game.currentProb.txt;
    document.getElementById('a-input').innerText = "";
    document.getElementById('score').innerText = game.score;
}

function press(key) {
    const div = document.getElementById('a-input');
    if (key === 'DEL') div.innerText = div.innerText.slice(0, -1);
    else if (key === 'ENT') submit();
    else if (div.innerText.length < 8) div.innerText += key;
}

function submit() {
    const val = parseFloat(document.getElementById('a-input').innerText);
    const correct = Math.abs(val - game.currentProb.ans) < 0.01;
    const latency = Date.now() - game.currentProb.start;

    // Update Global Stats
    const op = game.currentProb.op;
    stats.ops[op].t++;
    if (correct) {
        stats.ops[op].c++;
        stats.ops[op].totalMs += latency;
        game.score++;
        nextQ();
    } else {
        if (game.type === 'optiver') { game.score -= 2; nextQ(); }
        else {
            const input = document.getElementById('a-input');
            input.classList.add('wrong');
            setTimeout(() => { input.classList.remove('wrong'); input.innerText = ""; }, 200);
        }
    }
    save();
}

function endGame() {
    clearInterval(game.timer);
    stats.history.push({ score: game.score, type: game.type, ts: Date.now() });
    save();
    document.getElementById('screen-game').classList.add('hide');
    document.getElementById('main-nav').classList.remove('hide');
    switchTab('home');
}

function resetData() {
    if(confirm("Erase all progress?")) {
        stats = INITIAL_STATS;
        save();
        location.reload();
    }
}

// Global listeners
window.addEventListener('keydown', e => {
    if (e.key >= '0' && e.key <= '9' || e.key === '.') press(e.key);
    if (e.key === 'Enter') press('ENT');
    if (e.key === 'Backspace') press('DEL');
});

// Boot
renderHome();
</script>
</body>
</html>
